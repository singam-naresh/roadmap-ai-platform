services:
  - type: web
    name: roadmap-ai-backend
    runtime: docker
    region: oregon
    plan: free

    # Docker build — Render builds from backend/Dockerfile
    dockerfilePath: backend/Dockerfile
    dockerContext: backend

    # Render free tier exposes port 10000
    # The Dockerfile and application-prod.properties both default to 10000
    healthCheckPath: /health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: "10000"
      - key: GROQ_API_KEY
        sync: false          # Set manually in Render dashboard — never commit
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your Vercel frontend URL
      - key: H2_CONSOLE_ENABLED
        value: "false"
