services:
  - type: web
    name: roadmap-ai-backend
    runtime: docker
    region: oregon
    plan: free

    dockerfilePath: backend/Dockerfile
    dockerContext: backend

    # Render injects PORT automatically — do NOT hardcode it here
    # The app reads ${PORT} and binds to 0.0.0.0:${PORT}
    healthCheckPath: /api/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: H2_CONSOLE_ENABLED
        value: "false"
