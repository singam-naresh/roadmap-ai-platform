# Production Docker Compose — Adaptive AI Learning Roadmap Platform
# Usage: docker-compose -f docker-compose.production.yml up -d
#
# Required environment variables (set in .env or export before running):
#   GROQ_API_KEY     — your Groq API key
#   JWT_SECRET       — long random string for JWT signing
#   ALLOWED_ORIGINS  — comma-separated list of allowed frontend URLs

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    container_name: roadmap-ai-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - H2_CONSOLE_ENABLED=false
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    container_name: roadmap-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  app-data:
    driver: local
