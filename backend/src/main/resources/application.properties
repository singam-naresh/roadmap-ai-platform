# ============================================================
# Server
# ============================================================
server.port=${PORT:8080}

# Active profile: 'dev' disables rate limiting for local development
# Set SPRING_PROFILES_ACTIVE=prod in your deployment environment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ============================================================
# Database — H2 file-based (no external DB required)
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/ai_assistant_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console — disabled in production (enable only for local dev)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================================
# CORS
# ============================================================
spring.web.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

# ============================================================
# Groq API
# ============================================================
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=${GROQ_API_KEY:}
groq.api.model=llama-3.3-70b-versatile

# ============================================================
# JWT
# ============================================================
jwt.secret=${JWT_SECRET:please-set-a-real-secret-in-production-env-vars}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ============================================================
# Actuator — health check only exposed publicly
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

# ============================================================
# Compression
# ============================================================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ============================================================
# Logging — clean production output
# ============================================================
logging.level.com.assistant=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{30} - %msg%n

# ============================================================
# Application Info
# ============================================================
info.app.name=Adaptive AI Learning Roadmap Platform
info.app.version=1.0.0

# ============================================================
# Cache
# ============================================================
spring.cache.type=simple
spring.cache.cache-names=domainAnalysis,architectureAnalysis

# ============================================================
# Async thread pool
# ============================================================
aura.performance.core-pool-size=4
aura.performance.max-pool-size=16
aura.performance.queue-capacity=100
aura.performance.thread-name-prefix=roadmap-async-
