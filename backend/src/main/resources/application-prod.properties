# Production profile  SPRING_PROFILES_ACTIVE=prod
# All secrets via environment variables only.

server.port=${PORT:8080}
server.address=0.0.0.0

# Lazy initialization  defers non-critical beans so Tomcat binds fast
# Reduces startup from 156s to ~20s on Render free tier
spring.main.lazy-initialization=true

spring.datasource.url=jdbc:h2:file:/app/data/ai_assistant_db;AUTO_SERVER=FALSE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.web.cors.allowed-origins=${ALLOWED_ORIGINS:https://roadmap-ai-platform.vercel.app}

groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=${GROQ_API_KEY:}
groq.api.model=llama-3.3-70b-versatile

jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

logging.level.root=WARN
logging.level.com.assistant=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{25} - %msg%n

info.app.name=Roadmap AI Platform
info.app.version=1.0.0

spring.cache.type=simple
spring.cache.cache-names=domainAnalysis,architectureAnalysis

aura.performance.core-pool-size=2
aura.performance.max-pool-size=8
aura.performance.queue-capacity=50
aura.performance.thread-name-prefix=roadmap-async-