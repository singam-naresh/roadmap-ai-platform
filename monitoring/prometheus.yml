# PHASE 4: Prometheus Configuration for Aura OS Monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Aura OS Backend API Metrics
  - job_name: 'aura-backend'
    static_configs:
      - targets: ['aura-backend:8080']
    metrics_path: '/api/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s

  # System Metrics
  - job_name: 'aura-system'
    static_configs:
      - targets: ['aura-backend:8080']
    metrics_path: '/api/actuator/metrics'
    scrape_interval: 30s

  # Health Check Metrics
  - job_name: 'aura-health'
    static_configs:
      - targets: ['aura-backend:8080']
    metrics_path: '/api/health/metrics'
    scrape_interval: 30s

  # Redis Metrics (if Redis exporter is available)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Alerting rules (can be extended)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Alert rules for Aura OS
rule_files:
  - "aura_alerts.yml"